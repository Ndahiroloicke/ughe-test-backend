services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ughe_db
      POSTGRES_USER: ughe_user
      POSTGRES_PASSWORD: ughe_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ughe_user -d ughe_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      POSTGRES_DB: ughe_db
      POSTGRES_USER: ughe_user
      POSTGRES_PASSWORD: ughe_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      UGHE_APP_USERNAME: ughe_admin
      UGHE_APP_PASSWORD: UGHE_Test_2024!
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
